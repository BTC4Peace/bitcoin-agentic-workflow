name: Cleanup Review Branches

on:
  pull_request:
    types: [closed]

permissions:
  contents: write

jobs:
  cleanup:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.event.pull_request.head.ref, 'review/merge-') &&
      startsWith(github.event.pull_request.base.ref, 'review/base-')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Delete review branches
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          if [[ ! "$HEAD_REF" =~ ^review/merge-[0-9a-f]{7,40}$ ]]; then
            echo "Refusing to delete unexpected head ref: $HEAD_REF"
            exit 1
          fi
          if [[ ! "$BASE_REF" =~ ^review/base-[0-9a-f]{7,40}$ ]]; then
            echo "Refusing to delete unexpected base ref: $BASE_REF"
            exit 1
          fi

          gh api -X DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/${HEAD_REF}" || true
          gh api -X DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/${BASE_REF}" || true
