name: Cleanup Review Branches

on:
  schedule:
    - cron: '30 0 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: sync-bitcoin-core-merges
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Delete review branches not used by any open PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          # Fetch open PR branches first (fail fast if API errors so open PR branches are never deleted)
          OPEN_PR_REFS=$(gh pr list \
            --repo "$GITHUB_REPOSITORY" \
            --state open \
            --limit 1000 \
            --json headRefName,baseRefName \
            --jq '.[] | .headRefName, .baseRefName')

          declare -A ACTIVE_REFS=()
          while IFS= read -r REF; do
            [ -n "$REF" ] && ACTIVE_REFS["$REF"]=1
          done <<< "$OPEN_PR_REFS"

          REVIEW_REFS=$(gh api --paginate \
            "repos/${GITHUB_REPOSITORY}/git/matching-refs/heads/review/" \
            --jq '.[].ref | sub("^refs/heads/"; "")')

          DELETED=0
          while IFS= read -r BRANCH; do
            [ -z "$BRANCH" ] && continue

            if [[ ! "$BRANCH" =~ ^review/(merge|base)-[0-9a-f]{7,40}$ ]]; then
              echo "Skipping unexpected ref: $BRANCH"
              continue
            fi

            if [ -n "${ACTIVE_REFS[$BRANCH]:-}" ]; then
              echo "Keeping active PR branch: $BRANCH"
              continue
            fi

            echo "Deleting closed/orphaned review branch: $BRANCH"
            gh api -X DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/${BRANCH}" || true
            DELETED=$((DELETED + 1))
          done <<< "$REVIEW_REFS"

          echo "Cleanup complete. Deleted ${DELETED} branch(es)."
