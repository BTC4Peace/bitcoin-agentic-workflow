name: Cleanup Review Branches

on:
  pull_request:
    types: [closed]

permissions:
  contents: write

jobs:
  cleanup:
    if: startsWith(github.event.pull_request.head.ref, 'review/merge-') && startsWith(github.event.pull_request.base.ref, 'review/base-')
    runs-on: ubuntu-latest
    steps:
      - name: Delete review branches
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          gh api -X DELETE "repos/${{ github.repository }}/git/refs/heads/${HEAD_REF}" || true
          gh api -X DELETE "repos/${{ github.repository }}/git/refs/heads/${BASE_REF}" || true
