name: Create Review PRs for Bitcoin Core Merges

on:
  # TODO: Re-enable daily schedule (cron: '0 0 * * *') once manual testing is complete
  workflow_dispatch:
    inputs:
      # TODO: Remove rewind_merges input once manual testing is complete
      rewind_merges:
        description: 'TEMPORARY (testing): rewind upstream-tracker by N merge commits (0-5)'
        required: false
        default: '0'
        type: string

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: sync-bitcoin-core-merges
  cancel-in-progress: false

jobs:
  sync-merges:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout fork
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Fetch upstream master and tracker
        run: |
          git remote add upstream https://github.com/bitcoin/bitcoin.git
          git fetch upstream master
          git fetch origin upstream-tracker

      - name: Open isolated review PRs for new upstream merges
        id: create_prs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          # TODO: Remove REWIND_MERGES once manual testing is complete
          REWIND_MERGES: ${{ inputs.rewind_merges || '0' }}
          MAX_PRS_PER_RUN: 5
          QUEUE_LABEL: ${{ vars.QUEUE_LABEL || 'needs-audit' }}
        run: |
          # TODO: Remove REWIND_MERGES handling once manual testing is complete
          if [[ ! "$REWIND_MERGES" =~ ^[0-5]$ ]]; then
            echo "Invalid REWIND_MERGES value (must be 0-5): $REWIND_MERGES"
            exit 1
          fi

          if [ -z "${QUEUE_LABEL:-}" ]; then
            QUEUE_LABEL="needs-audit"
          fi
          if [[ "$QUEUE_LABEL" =~ [[:cntrl:]] ]] || [[ "$QUEUE_LABEL" =~ ^[[:space:]]*$ ]]; then
            echo "Invalid QUEUE_LABEL value."
            exit 1
          fi

          CREATED_COUNT=0
          write_outputs() {
            if [ -n "${GITHUB_OUTPUT:-}" ]; then
              {
                echo "created_count=${CREATED_COUNT}"
                if [ "$CREATED_COUNT" -gt 0 ]; then
                  echo "has_created=true"
                else
                  echo "has_created=false"
                fi
              } >> "$GITHUB_OUTPUT"
            fi
          }
          trap write_outputs EXIT

          ORIG_TRACKER=$(git rev-parse "origin/upstream-tracker")
          LAST_SEEN=$(git rev-parse "${ORIG_TRACKER}~${REWIND_MERGES}")
          advance_tracker() {
            local target_sha="$1"
            if [ "$target_sha" != "$ORIG_TRACKER" ] && git merge-base --is-ancestor "$ORIG_TRACKER" "$target_sha"; then
              git push origin "${target_sha}:refs/heads/upstream-tracker"
              ORIG_TRACKER="$target_sha"
            fi
          }

          ensure_repo_label() {
            local label_json="$1"
            local label_name=""
            label_name=$(printf '%s\n' "$label_json" | jq -r '.name')
            [ -n "$label_name" ] || return 1

            local encoded_name=""
            encoded_name=$(jq -rn --arg l "$label_name" '$l|@uri')
            if gh api "repos/${GITHUB_REPOSITORY}/labels/${encoded_name}" >/dev/null 2>&1; then
              return 0
            fi

            local err_out=""
            if ! err_out=$(printf '%s\n' "$label_json" | gh api --method POST "repos/${GITHUB_REPOSITORY}/labels" --input - 2>&1 >/dev/null); then
              if grep -qE '422|already_exists' <<< "$err_out"; then
                return 0
              fi
              echo "Warning: failed to ensure label '${label_name}': ${err_out}"
              return 1
            fi
          }

          copy_upstream_labels() {
            local pr_url="$1"
            local sha="$2"
            local title="$3"

            local pr_num="${pr_url##*/}"
            if [[ ! "$pr_num" =~ ^[0-9]+$ ]]; then
              return 0
            fi

            local upstream_pr=""
            if [[ "$title" =~ ^Merge[[:space:]]+(bitcoin/bitcoin)?#([0-9]+)([^0-9]|$) ]]; then
              upstream_pr="${BASH_REMATCH[2]}"
            else
              upstream_pr=$(gh api "repos/bitcoin/bitcoin/commits/${sha}/pulls" \
                --jq '[.[] | select(.base.repo.full_name == "bitcoin/bitcoin")][0].number // empty' \
                2>/dev/null || true)
            fi
            if [[ ! "$upstream_pr" =~ ^[0-9]+$ ]]; then
              return 0
            fi

            local labels_json=""
            labels_json=$(gh api "repos/bitcoin/bitcoin/issues/${upstream_pr}" \
              --jq '[.labels[]?
                | select((.name // "") | (type == "string") and (length > 0))
                | select((.name | ascii_downcase) != "help wanted")
                | select((.name | ascii_downcase | test("^needs[ -]+backport")) | not)
                | {
                    name: .name,
                    color: (if ((.color // "") | test("^[0-9a-fA-F]{6}$")) then .color else "ededed" end),
                    description: ((.description // "") | tostring | .[0:100])
                  }]' \
              2>/dev/null || true)

            if [ -z "$labels_json" ]; then
              return 0
            fi

            local label_count=""
            label_count=$(printf '%s\n' "$labels_json" | jq -r 'length' 2>/dev/null || echo 0)
            if [[ ! "$label_count" =~ ^[0-9]+$ ]] || [ "$label_count" -eq 0 ]; then
              return 0
            fi

            # Ensure each upstream label exists on this fork with matching color/description (JSON input avoids flag injection)
            local label_obj=""
            while IFS= read -r label_obj; do
              [ -n "$label_obj" ] || continue
              ensure_repo_label "$label_obj" || true
            done < <(printf '%s\n' "$labels_json" | jq -c '.[]')

            local label_names_json=""
            label_names_json=$(printf '%s\n' "$labels_json" | jq -c '{labels: [.[].name]}')
            if printf '%s\n' "$label_names_json" | gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${pr_num}/labels" --input - >/dev/null 2>&1; then
              local label_list=""
              label_list=$(printf '%s\n' "$labels_json" | jq -r '[.[].name] | join(", ")')
              echo "Copied upstream PR #${upstream_pr} labels: ${label_list}"
            else
              echo "Warning: failed to attach upstream labels from #${upstream_pr} to PR #${pr_num}."
            fi
          }

          ensure_queue_label() {
            local queue_label="$1"
            local label_json=""
            label_json=$(jq -nc --arg name "$queue_label" '{name: $name, color: "fbca04", description: "Queued for local code audit"}')
            ensure_repo_label "$label_json" || true
          }

          attach_queue_label() {
            local pr_url="$1"
            local queue_label="$2"
            local pr_num="${pr_url##*/}"
            if [[ ! "$pr_num" =~ ^[0-9]+$ ]]; then
              echo "Error: invalid PR number extracted from URL '$pr_url'."
              return 1
            fi

            local payload=""
            payload=$(jq -nc --arg q "$queue_label" '{labels: [$q]}')
            for ATTEMPT in 1 2 3; do
              if printf '%s\n' "$payload" | gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${pr_num}/labels" --input - >/dev/null; then
                return 0
              fi
              echo "Failed to attach queue label '${queue_label}' to PR #${pr_num} (attempt ${ATTEMPT}/3); retrying in $((ATTEMPT * 5))s..."
              sleep $((ATTEMPT * 5))
            done
            echo "Error: failed to attach queue label '${queue_label}' to PR #${pr_num} after 3 attempts."
            return 1
          }

          mapfile -t COMMITS < <(git rev-list --first-parent --reverse "${LAST_SEEN}..upstream/master")
          if [ "${#COMMITS[@]}" -eq 0 ]; then
            echo "No new merges found."
            exit 0
          fi

          ensure_queue_label "$QUEUE_LABEL"

          echo "## Bitcoin Core Merge Review Queue Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          for SHA in "${COMMITS[@]}"; do
            if [ "$CREATED_COUNT" -ge "$MAX_PRS_PER_RUN" ]; then
              break
            fi

            SHORT_SHA=$(git rev-parse --short=12 "$SHA")
            BASE_BRANCH="review/base-${SHORT_SHA}"
            HEAD_BRANCH="review/merge-${SHORT_SHA}"

            # Ignore cross-repository fork PRs so external forks cannot spoof/suppress reviews
            EXISTING_PR=$(gh pr list \
              --repo "$GITHUB_REPOSITORY" \
              --head "$HEAD_BRANCH" \
              --state open \
              --json url,isCrossRepository \
              --jq '[.[] | select(.isCrossRepository == false)][0].url // empty')

            if [ -n "$EXISTING_PR" ]; then
              echo "Open PR already exists for $HEAD_BRANCH ($EXISTING_PR), skipping."
              advance_tracker "$SHA"
              continue
            fi

            TITLE=$(git log -1 --format=%s "$SHA")
            PR_TITLE="[Review] $TITLE"
            if [ "${#PR_TITLE}" -gt 256 ]; then
              PR_TITLE="${PR_TITLE:0:253}..."
            fi
            BODY=$(git log -1 --format=%b "$SHA")
            PR_BODY=$(printf '%s\n\n%s' \
              "Upstream commit: https://github.com/bitcoin/bitcoin/commit/${SHA}" \
              "$BODY")
            if [ "${#PR_BODY}" -gt 65000 ]; then
              PR_BODY="${PR_BODY:0:64950}"$'\n\n... [commit message truncated]'
            fi

            git push --force origin "${SHA}^1:refs/heads/${BASE_BRANCH}"
            git push --force origin "${SHA}:refs/heads/${HEAD_BRANCH}"

            PR_URL=""
            for ATTEMPT in 1 2 3; do
              if PR_URL=$(printf '%s\n' "$PR_BODY" | gh pr create \
                --repo "$GITHUB_REPOSITORY" \
                --base "$BASE_BRANCH" \
                --head "$HEAD_BRANCH" \
                --title "$PR_TITLE" \
                --body-file -); then
                break
              fi
              echo "gh pr create failed (attempt ${ATTEMPT}/3); retrying in $((ATTEMPT * 5))s..."
              sleep $((ATTEMPT * 5))
            done

            if [ -z "$PR_URL" ]; then
              echo "Error: failed to create PR for $SHORT_SHA after 3 attempts."
              exit 1
            fi

            echo "Created PR: $PR_URL"
            copy_upstream_labels "$PR_URL" "$SHA" "$TITLE" || true
            if ! attach_queue_label "$PR_URL" "$QUEUE_LABEL"; then
              exit 1
            fi

            SAFE_TITLE=$(printf '%s' "$TITLE" | tr -d '[]\r\n')
            printf -- '- [%s](%s) (`%s`) — queued (`%s`)\n' "$SAFE_TITLE" "$PR_URL" "$SHORT_SHA" "$QUEUE_LABEL" >> "$GITHUB_STEP_SUMMARY"

            advance_tracker "$SHA"
            CREATED_COUNT=$((CREATED_COUNT + 1))
          done

      - name: Send ntfy wake-up signal
        if: (success() || failure()) && steps.create_prs.outputs.created_count != '' && steps.create_prs.outputs.created_count != '0'
        env:
          NTFY_URL: ${{ secrets.NTFY_URL || vars.NTFY_URL }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC || vars.NTFY_TOPIC }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
        run: |
          ntfy_url="${NTFY_URL:-}"
          ntfy_topic="${NTFY_TOPIC:-}"
          ntfy_token="${NTFY_TOKEN:-}"

          if [ -z "$ntfy_url" ] || [ -z "$ntfy_topic" ]; then
            echo "::warning::ntfy wake-up skipped (NTFY_URL or NTFY_TOPIC not configured)."
            exit 0
          fi

          if [[ "$ntfy_url" == *'"'* || "$ntfy_url" == *'\'* || "$ntfy_url" =~ [[:space:][:cntrl:]] ]]; then
            echo "::warning::ntfy wake-up skipped (NTFY_URL contains invalid characters)."
            exit 0
          fi

          while [[ "$ntfy_url" == */ ]]; do
            ntfy_url="${ntfy_url%/}"
          done

          url_re='^https://[^/]+(/.*)?$'
          if [[ ! "$ntfy_url" =~ $url_re ]]; then
            echo "::warning::ntfy wake-up skipped (NTFY_URL must be a valid https:// URL)."
            exit 0
          fi

          ntfy_topic="${ntfy_topic#/}"
          ntfy_topic="${ntfy_topic%/}"
          topic_re='^[A-Za-z0-9._~-]+$'
          if [[ ! "$ntfy_topic" =~ $topic_re ]]; then
            echo "::warning::ntfy wake-up skipped (NTFY_TOPIC contains invalid characters or is empty)."
            exit 0
          fi

          if [ -n "$ntfy_token" ]; then
            if [[ "$ntfy_token" == *'"'* || "$ntfy_token" == *'\'* || "$ntfy_token" =~ [[:cntrl:]] ]]; then
              echo "::warning::ntfy wake-up skipped (NTFY_TOKEN contains invalid characters)."
              exit 0
            fi
          fi

          target_url="${ntfy_url}/${ntfy_topic}"
          curl_rc=0
          http_code=$(
            {
              printf 'url = "%s"\n' "$target_url"
              if [ -n "$ntfy_token" ]; then
                printf 'header = "Authorization: Bearer %s"\n' "$ntfy_token"
              fi
            } | curl -s --proto '=https' --tlsv1.2 --connect-timeout 10 --max-time 15 \
              -X POST -H "Content-Length: 0" \
              -o /dev/null -w '%{http_code}' \
              -K - 2>/dev/null
          ) || curl_rc=$?
          http_code="${http_code:-000}"

          if [ "$curl_rc" -ne 0 ] || [[ ! "$http_code" =~ ^2[0-9]{2}$ ]]; then
            echo "::warning::ntfy wake-up POST failed (exit=${curl_rc}, http=${http_code}); review PRs remain queued."
            exit 0
          fi
          echo "Sent contentless ntfy wake-up signal (http=${http_code})."
